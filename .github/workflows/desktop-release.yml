name: BotOrgHQ desktop release

on:
  push:
    branches: [main]
    paths:
      - desktop/package.json
      - .github/workflows/desktop-release.yml
      - .github/actions/package-desktop/action.yml
      - .github/scripts/desktop-release.sh
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.repository }}
  cancel-in-progress: false

env:
  GH_REPO: ${{ github.repository }}

jobs:
  stage:
    name: Create or resume draft release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.stage.outputs.tag }}
      build: ${{ steps.stage.outputs.build }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare the version draft
        id: stage
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/desktop-release.sh stage

  build:
    needs: stage
    if: needs.stage.outputs.build == 'true'
    permissions:
      contents: write
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            platform: win
            arch: x64
            extension: exe
          - runner: macos-15
            platform: mac
            arch: arm64
            extension: zip
          - runner: macos-15-intel
            platform: mac
            arch: x64
            extension: zip
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/package-desktop
        id: package
        with:
          arch: ${{ matrix.arch }}
          platform: ${{ matrix.platform }}
          extension: ${{ matrix.extension }}
      - name: Package the DSH plugin
        if: matrix.platform == 'win'
        run: npm pack --pack-destination desktop/dist
      - name: Upload verified packages to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stage.outputs.tag }}
          INSTALLER: ${{ steps.package.outputs.installer }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          files=("$INSTALLER")
          if [ "$PLATFORM" = win ]; then
            version="${TAG#v}"
            files+=("desktop/dist/bot-org-hq-${version%-desktop}.tgz")
          fi
          bash .github/scripts/desktop-release.sh upload "${files[@]}"

  publish:
    name: Publish the desktop downloads together
    needs: [stage, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Verify the draft assets, attach checksums and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.stage.outputs.tag }}
        run: bash .github/scripts/desktop-release.sh publish
